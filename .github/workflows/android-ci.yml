name: Android CI

# Every push to main runs the full JVM unit-test suite (core, conductor, voice engine,
# Robolectric screen renders) and then assembles a debug APK as a downloadable artifact.
# Actions tab → run → Artifacts 에서 hjtk-debug-apk 를 내려받으면 된다.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests + debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: DeepSeek stream hook test (tap.js)
        run: node tools/tap-test.js app/src/main/assets/tap.js

      - name: Review gate (no on-device LLM, no web-API reimplementation, no TODOs)
        run: bash tools/review-gate.sh app/src/main

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest :voicecore:test --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hjtk-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload rendered screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-screens
          path: app/build/screens/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 14
