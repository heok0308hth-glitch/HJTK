name: build-apk
on:
  push: { branches: [ main ] }
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: tap.js stream hook test
        run: node tools/tap-test.js app/src/main/assets/tap.js
      - name: Unit tests (core engine + rendered screens)
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Review gate
        run: bash tools/review-gate.sh app/src/main
      - name: Assemble
        run: ./gradlew --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: hjtk-debug-apk, path: app/build/outputs/apk/*/debug/*.apk }
      - uses: actions/upload-artifact@v4
        with: { name: rendered-screens, path: app/build/screens/*.png }
